name: ci

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      worker: ${{ steps.filter.outputs.worker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'api/openapi.yaml'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'turbo.json'
            api:
              - 'cmd/api/**'
              - 'cmd/migrate/**'
              - 'cmd/seed/**'
              - 'cmd/demo/**'
              - 'cmd/glbackfill/**'
              - 'internal/**'
              - 'api/**'
              - 'tests/api/**'
              - 'scripts/test/**'
              - 'go.mod'
              - 'go.sum'
              - 'db/migrations/**'
            worker:
              - 'cmd/worker/**'
              - 'internal/**'
              - 'go.mod'
              - 'go.sum'
              - 'db/migrations/**'

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.6.12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mlf-erp/web typecheck
      - run: pnpm test:frontend
      - run: pnpm --filter @mlf-erp/web build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...
      - run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=${{ github.sha }}" -o dist/api ./cmd/api
      - run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/migrate ./cmd/migrate
      - run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/seed ./cmd/seed
      - run: go build ./cmd/demo
      - run: go build ./cmd/glbackfill
      - uses: actions/upload-artifact@v4
        with:
          name: api-bin
          path: |
            dist/api
            dist/migrate
            dist/seed

  api-integration:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mlf
          POSTGRES_PASSWORD: mlf
          POSTGRES_DB: mlf_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgres://mlf:mlf@localhost:5432/mlf_erp?sslmode=disable
      DB_ENABLED: 'true'
      HTTP_ADDR: ':18080'
      LOG_LEVEL: error
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go run ./cmd/migrate -direction up
      - run: go run ./cmd/seed
      - run: go run ./cmd/demo
      - run: go build -o dist/api ./cmd/api
      - name: Run Stage 3B API integration tests
        run: |
          set -euo pipefail
          ./dist/api > api-integration.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:18080/readyz > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:18080/readyz > /dev/null
          TEST_API_BASE_URL=http://localhost:18080 go test -tags=integration ./tests/api -run 'TestStage3' -count=1 -v
      - name: Show API log on failure
        if: failure()
        run: cat api-integration.log || true

  worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=${{ github.sha }}" -o dist/worker ./cmd/worker
      - uses: actions/upload-artifact@v4
        with:
          name: worker-bin
          path: dist/worker

  gate:
    if: always()
    needs: [changes, web, api, api-integration, worker]
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        run: |
          [ "${{ needs.changes.result }}" = "success" ] || exit 1
          for result in "${{ needs.web.result }}" "${{ needs.api.result }}" "${{ needs.api-integration.result }}" "${{ needs.worker.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) echo "required job failed: $result"; exit 1 ;;
            esac
          done
