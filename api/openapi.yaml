openapi: 3.1.0
info:
  title: MLF ERP API
  version: 1.2.0
  description: |
    MLF ERP Stage 1 + Stage 2 + Stage 3A/3B/3C/3D/3E/3F/3G/3H/3I/3J API contract.
    Master data uses a generic CRUD surface under /masterdata/{entity}.
    Purchase, sales, inventory, receivables/payables, payments, general ledger and reports are included.
    Stage 3H adds sales returns and credit notes; Stage 3I adds purchase returns.
    Stage 3J adds credit note allocation and refund workflows.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /runtime-config:
    get:
      summary: Get runtime configuration and capabilities
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeConfigResponse'
  /auth/login:
    post:
      summary: Login with username and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /auth/refresh:
    post:
      summary: Rotate access and refresh tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Rotated tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid or replayed refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /auth/me:
    get:
      summary: Get current user, roles and permissions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /auth/logout:
    post:
      summary: Revoke the refresh-token family for the current session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /system/code-rules:
    get:
      summary: List code rules
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CodeRule'
    post:
      summary: Create a code rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeRuleInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeRule'
  /masterdata/{entity}:
    parameters:
      - $ref: '#/components/parameters/Entity'
    get:
      summary: List master data records
      parameters:
        - $ref: '#/components/parameters/Keyword'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterDataListResponse'
    post:
      summary: Create a master data record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasterDataInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterDataResponse'
  /masterdata/{entity}/{id}:
    parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/ID'
    get:
      summary: Get a master data record
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterDataResponse'
        '404':
          description: Not found or outside data scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    put:
      summary: Update a master data record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasterDataInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterDataResponse'
    delete:
      summary: Disable a master data record
      responses:
        '200':
          description: Disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    post:
      summary: Enable a master data record
      responses:
        '200':
          description: Enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /purchase/orders:
    get:
      summary: List purchase orders
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Keyword'
        - in: query
          name: status
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/PurchaseOrder'
                          total:
                            type: integer
    post:
      summary: Create a purchase order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /purchase/orders/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      summary: Get a purchase order
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    put:
      summary: Update a draft purchase order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderResponse'
  /purchase/orders/{id}/submit:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      summary: Submit a draft purchase order
      responses:
        '200':
          description: Submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
  /purchase/orders/{id}/approve:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      summary: Approve a submitted purchase order
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
  /purchase/orders/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      summary: Cancel a purchase order without receipts
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
  /purchase/orders/{id}/receive:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      summary: Receive goods and create a payable invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseReceiveInput'
      responses:
        '201':
          description: Receipt posted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseReceiptResponse'
  /purchase/receipts:
    get:
      summary: List purchase receipts
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - in: query
          name: order_id
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/PurchaseReceipt'
                          total:
                            type: integer
  /purchase/receipts/{id}/returns:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      summary: Create a purchase return, credit note and inventory issue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePurchaseReturnInput'
      responses:
        '201':
          description: Purchase return posted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseReturnResponse'
        '400':
          description: Invalid return payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          description: Receipt, receipt line or payable invoice not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '409':
          description: Over return, insufficient stock, invalid status or closed accounting period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /purchase/returns:
    get:
      summary: List purchase returns
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Keyword'
        - in: query
          name: receipt_id
          schema:
            type: string
            format: uuid
        - in: query
          name: supplier_id
          schema:
            type: string
            format: uuid
        - in: query
          name: start_date
          schema:
            type: string
            format: date
        - in: query
          name: end_date
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/PurchaseReturn'
                          total:
                            type: integer
  /purchase/returns/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      summary: Get a purchase return with lines
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseReturnResponse'
        '404':
          description: Purchase return not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /sales/orders:
    get:
      summary: List sales orders
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Keyword'
        - in: query
          name: status
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/SalesOrder'
                          total:
                            type: integer
    post:
      summary: Create a sales order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesOrderInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /sales/orders/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      summary: Get a sales order
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderResponse'
    put:
      summary: Update a draft sales order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesOrderInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderResponse'
  /sales/orders/{id}/submit:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      summary: Submit a draft sales order
      responses:
        '200':
          description: Submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
  /sales/orders/{id}/approve:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      summary: Approve a submitted sales order
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
  /sales/orders/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      summary: Cancel a sales order without shipments
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
  /sales/orders/{id}/ship:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      summary: Ship goods, deduct inventory and create a receivable invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesShipInput'
      responses:
        '201':
          description: Shipment posted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentResponse'
        '409':
          description: Over shipment or insufficient stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /sales/shipments:
    get:
      summary: List sales shipments
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - in: query
          name: order_id
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/Shipment'
                          total:
                            type: integer
  /sales/shipments/{id}/returns:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      summary: Create a sales return, credit note and inventory receipt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSalesReturnInput'
      responses:
        '201':
          description: Sales return posted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesReturnResponse'
        '400':
          description: Invalid return payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          description: Shipment, shipment line or receivable invoice not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '409':
          description: Over return, invalid status or closed accounting period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /sales/returns:
    get:
      summary: List sales returns
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Keyword'
        - in: query
          name: shipment_id
          schema:
            type: string
            format: uuid
        - in: query
          name: customer_id
          schema:
            type: string
            format: uuid
        - in: query
          name: start_date
          schema:
            type: string
            format: date
        - in: query
          name: end_date
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/SalesReturn'
                          total:
                            type: integer
  /sales/returns/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      summary: Get a sales return with lines
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesReturnResponse'
        '404':
          description: Sales return not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /inventory/balances:
    get:
      summary: List inventory balances
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Keyword'
        - in: query
          name: warehouse_id
          schema:
            type: string
            format: uuid
        - in: query
          name: material_id
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/InventoryBalance'
                          total:
                            type: integer
  /inventory/transactions:
    get:
      summary: List inventory transactions
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Keyword'
        - in: query
          name: warehouse_id
          schema:
            type: string
            format: uuid
        - in: query
          name: material_id
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/InventoryTransaction'
                          total:
                            type: integer
  /finance/exchange-rates:
    get:
      summary: List exchange rates
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - in: query
          name: currency
          schema:
            type: string
        - in: query
          name: start_date
          schema:
            type: string
            format: date
        - in: query
          name: end_date
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/ExchangeRate'
                          total:
                            type: integer
    post:
      summary: Create or update an exchange rate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeRateInput'
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ExchangeRate'
  /finance/exchange-rates/latest:
    get:
      summary: Get the latest exchange rate on or before a date
      parameters:
        - in: query
          name: currency
          required: true
          schema:
            type: string
        - in: query
          name: date
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Rate not found or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /finance/exchange-rates/{id}:
    put:
      summary: Update an exchange rate
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeRateInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ExchangeRate'
  /finance/invoices:
    get:
      summary: List receivable and payable invoices
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Keyword'
        - in: query
          name: invoice_type
          schema:
            type: string
            enum: [receivable, payable]
        - in: query
          name: status
          schema:
            type: string
            enum: [open, partially_paid, paid]
        - in: query
          name: vat_invoice_status
          schema:
            type: string
            enum: [pending, issued, void]
        - in: query
          name: partner_id
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/Invoice'
                          total:
                            type: integer
  /finance/invoices/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      summary: Get an invoice with allocation records
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/InvoiceDetail'
  /finance/invoices/{id}/issue:
    post:
      summary: Issue a VAT invoice
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vat_invoice_no, vat_invoice_type, vat_invoice_date]
              properties:
                vat_invoice_no:
                  type: string
                vat_invoice_type:
                  type: string
                  enum: [special, general]
                vat_invoice_date:
                  type: string
                  format: date
                buyer_tax_no:
                  type: string
                seller_tax_no:
                  type: string
      responses:
        '200':
          description: Issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Invoice'
        '409':
