openapi: 3.1.0
info:
  title: MLF ERP API
  version: 0.3.0
  description: |
    MLF ERP Stage 1 + Stage 2 + Stage 3A/3B API contract.
    Master data uses a generic CRUD surface under /masterdata/{entity}.
    Purchase, sales, inventory, receivables/payables and payments are included.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /runtime-config:
    get:
      summary: Get runtime configuration and capabilities
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeConfigResponse'
  /auth/login:
    post:
      summary: Login with username and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /auth/refresh:
    post:
      summary: Rotate access and refresh tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Rotated tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid or replayed refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /auth/me:
    get:
      summary: Get current user, roles and permissions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /auth/logout:
    post:
      summary: Revoke the refresh-token family for the current session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /system/code-rules:
    get:
      summary: List code rules
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CodeRule'
    post:
      summary: Create a code rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeRuleInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeRule'
  /masterdata/{entity}:
    parameters:
      - $ref: '#/components/parameters/Entity'
    get:
      summary: List master data records
      parameters:
        - $ref: '#/components/parameters/Keyword'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterDataListResponse'
    post:
      summary: Create a master data record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasterDataInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterDataResponse'
  /masterdata/{entity}/{id}:
    parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/ID'
    get:
      summary: Get a master data record
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterDataResponse'
        '404':
          description: Not found or outside data scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    put:
      summary: Update a master data record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasterDataInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterDataResponse'
    delete:
      summary: Disable a master data record
      responses:
        '200':
          description: Disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    post:
      summary: Enable a master data record
      responses:
        '200':
          description: Enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /purchase/orders:
    get:
      summary: List purchase orders
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Keyword'
        - in: query
          name: status
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/PurchaseOrder'
                          total:
                            type: integer
    post:
      summary: Create a purchase order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /purchase/orders/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      summary: Get a purchase order
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    put:
      summary: Update a draft purchase order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderResponse'
  /purchase/orders/{id}/submit:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      summary: Submit a draft purchase order
      responses:
        '200':
          description: Submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
  /purchase/orders/{id}/approve:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      summary: Approve a submitted purchase order
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
  /purchase/orders/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      summary: Cancel a purchase order without receipts
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
  /purchase/orders/{id}/receive:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      summary: Receive goods and create a payable invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseReceiveInput'
      responses:
        '201':
          description: Receipt posted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseReceiptResponse'
  /purchase/receipts:
    get:
      summary: List purchase receipts
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - in: query
          name: order_id
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/PurchaseReceipt'
                          total:
                            type: integer
  /sales/orders:
    get:
      summary: List sales orders
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Keyword'
        - in: query
          name: status
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/SalesOrder'
                          total:
                            type: integer
    post:
      summary: Create a sales order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesOrderInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /sales/orders/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      summary: Get a sales order
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderResponse'
    put:
      summary: Update a draft sales order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesOrderInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderResponse'
  /sales/orders/{id}/submit:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      summary: Submit a draft sales order
      responses:
        '200':
          description: Submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
  /sales/orders/{id}/approve:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      summary: Approve a submitted sales order
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
  /sales/orders/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      summary: Cancel a sales order without shipments
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
  /sales/orders/{id}/ship:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      summary: Ship goods, deduct inventory and create a receivable invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesShipInput'
      responses:
        '201':
          description: Shipment posted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentResponse'
        '409':
          description: Over shipment or insufficient stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /sales/shipments:
    get:
      summary: List sales shipments
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - in: query
          name: order_id
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/Shipment'
                          total:
                            type: integer
  /inventory/balances:
    get:
      summary: List inventory balances
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Keyword'
        - in: query
          name: warehouse_id
          schema:
            type: string
            format: uuid
        - in: query
          name: material_id
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/InventoryBalance'
                          total:
                            type: integer
  /inventory/transactions:
    get:
      summary: List inventory transactions
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Keyword'
        - in: query
          name: warehouse_id
          schema:
            type: string
            format: uuid
        - in: query
          name: material_id
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/InventoryTransaction'
                          total:
                            type: integer
  /finance/invoices:
    get:
      summary: List receivable and payable invoices
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Keyword'
        - in: query
          name: invoice_type
          schema:
            type: string
            enum: [receivable, payable]
        - in: query
          name: status
          schema:
            type: string
            enum: [open, partially_paid, paid]
        - in: query
          name: partner_id
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/Invoice'
                          total:
                            type: integer
  /finance/invoices/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      summary: Get an invoice with allocation records
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/InvoiceDetail'
  /finance/payments:
    get:
      summary: List receipts and payments
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Keyword'
        - in: query
          name: payment_type
          schema:
            type: string
            enum: [receipt, payment]
        - in: query
          name: status
          schema:
            type: string
            enum: [unallocated, partially_allocated, allocated]
        - in: query
          name: partner_id
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/Payment'
                          total:
                            type: integer
    post:
      summary: Create a receipt or payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
  /finance/payments/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      summary: Get a receipt or payment
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
  /finance/payments/{id}/allocate:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      summary: Allocate a receipt/payment to invoices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [allocations]
              properties:
                allocations:
                  type: array
                  items:
                    $ref: '#/components/schemas/PaymentAllocationInput'
      responses:
        '200':
          description: Allocated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          description: Over allocation or type/partner/currency mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Entity:
      in: path
      name: entity
      required: true
      schema:
        type: string
        enum: [partners, materials, warehouses, units, currencies, tax-rates]
    ID:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    Keyword:
      in: query
      name: keyword
      required: false
      schema:
        type: string
    Page:
      in: query
      name: page
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      in: query
      name: page_size
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
  schemas:
    ApiResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        data: {}
        request_id:
          type: string
    RuntimeConfig:
      type: object
      properties:
        app:
          type: string
        env:
          type: string
        delivery_mode:
          type: string
          enum: [saas, onprem]
        capabilities:
          type: array
          items:
            type: string
    RuntimeConfigResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RuntimeConfig'
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        tenant_id:
          type: string
          format: uuid
        username:
          type: string
        password:
          type: string
    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                access_token:
                  type: string
                refresh_token:
                  type: string
                expires_in:
                  type: integer
                user:
                  $ref: '#/components/schemas/User'
                roles:
                  type: array
                  items:
                    type: string
                permissions:
                  type: array
                  items:
                    type: string
    MeResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                user:
                  $ref: '#/components/schemas/User'
                roles:
                  type: array
                  items:
                    type: string
                permissions:
                  type: array
                  items:
                    type: string
    User:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        org_id:
          type: string
        username:
          type: string
        display_name:
          type: string
        email:
          type: string
        status:
          type: string
        is_super_admin:
          type: boolean
    CodeRule:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        entity:
          type: string
        prefix:
          type: string
        date_pattern:
          type: string
        separator:
          type: string
        sequence_length:
          type: integer
        current_value:
          type: integer
        reset_policy:
          type: string
        last_reset_date:
          type: string
          format: date
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CodeRuleInput:
      type: object
      required: [entity, prefix, sequence_length]
      properties:
        entity:
          type: string
        prefix:
          type: string
        date_pattern:
          type: string
          enum: [none, yyyy, yyyyMM, yyyyMMdd]
        separator:
          type: string
        sequence_length:
          type: integer
          minimum: 1
          maximum: 10
        reset_policy:
          type: string
          enum: [never, year, month, day]
        status:
          type: string
          enum: [active, disabled]
    MasterDataInput:
      type: object
      description: Fields depend on entity. Common fields shown here.
      properties:
        code:
          type: string
          description: Optional when the entity has a code rule.
        name:
          type: string
        type:
          type: string
        category:
          type: string
    MasterDataItem:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        org_id:
          type: string
        code:
          type: string
        name:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MasterDataResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/MasterDataItem'
    MasterDataListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/MasterDataItem'
                total:
                  type: integer
    ActionResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                id:
                  type: string
                action:
                  type: string
    PurchaseOrderLine:
      type: object
      properties:
        id:
          type: string
        line_no:
          type: integer
        material_id:
          type: string
        material_name:
          type: string
        quantity:
          type: string
        unit_price:
          type: string
        amount:
          type: string
        received_qty:
          type: string
        remaining_qty:
          type: string
    PurchaseOrder:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        supplier_id:
          type: string
        supplier_name:
          type: string
        warehouse_id:
          type: string
        warehouse_name:
          type: string
        order_date:
          type: string
          format: date
        currency:
