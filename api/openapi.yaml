components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Entity:
      in: path
      name: entity
      required: true
      schema:
        type: string
        enum: [partners, materials, warehouses, units, currencies, tax-rates]
    ID:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    Keyword:
      in: query
      name: keyword
      required: false
      schema:
        type: string
    Page:
      in: query
      name: page
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      in: query
      name: page_size
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
  schemas:
    ApiResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        data: {}
        request_id:
          type: string
    RuntimeConfig:
      type: object
      properties:
        app:
          type: string
        env:
          type: string
        delivery_mode:
          type: string
          enum: [saas, onprem]
        capabilities:
          type: array
          items:
            type: string
    RuntimeConfigResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RuntimeConfig'
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        tenant_id:
          type: string
          format: uuid
        username:
          type: string
        password:
          type: string
    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                access_token:
                  type: string
                refresh_token:
                  type: string
                expires_in:
                  type: integer
                user:
                  $ref: '#/components/schemas/User'
                roles:
                  type: array
                  items:
                    type: string
                permissions:
                  type: array
                  items:
                    type: string
    MeResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                user:
                  $ref: '#/components/schemas/User'
                roles:
                  type: array
                  items:
                    type: string
                permissions:
                  type: array
                  items:
                    type: string
    User:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        org_id:
          type: string
        username:
          type: string
        display_name:
          type: string
        email:
          type: string
        status:
          type: string
        is_super_admin:
          type: boolean
    CodeRule:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        entity:
          type: string
        prefix:
          type: string
        date_pattern:
          type: string
        separator:
          type: string
        sequence_length:
          type: integer
        current_value:
          type: integer
        reset_policy:
          type: string
        last_reset_date:
          type: string
          format: date
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CodeRuleInput:
      type: object
      required: [entity, prefix, sequence_length]
      properties:
        entity:
          type: string
        prefix:
          type: string
        date_pattern:
          type: string
          enum: [none, yyyy, yyyyMM, yyyyMMdd]
